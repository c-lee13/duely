[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# XRPL EVM docs: Prague-compatible; earlier targets (incl. cancun) remain fully compatible.
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
xrpl_evm_testnet = "${XRPL_EVM_RPC_URL}"

[invariant]
runs = 128
depth = 100
fail_on_revert = true

[fmt]
line_length = 100

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# `FOUNDRY_PROFILE=deep forge test` runs the stateful and fuzz suites much harder (A6). Same settings as
# the default profile otherwise; only run counts and sequence depth change.
[profile.deep.fuzz]
runs = 5000

[profile.deep.invariant]
runs = 400
depth = 200
fail_on_revert = true
